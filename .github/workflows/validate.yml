name: validate

on:
  push:
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifests are in sync
        run: node scripts/check-consistency.mjs
      - name: Validate Claude Code plugin
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
